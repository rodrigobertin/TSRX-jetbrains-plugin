name: CI
on:
  push:
    branches: [main, master]
  pull_request:
jobs:
  grammar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/regenerate-textmate.js
      - run: git diff --exit-code -- src/main/resources/textmate grammars/textmate
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/regenerate-textmate.js
      - run: ./gradlew buildPlugin --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: plugin
          path: build/distributions/*.zip
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: node scripts/regenerate-textmate.js
      - run: ./gradlew verifyPlugin --stacktrace || true
